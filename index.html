<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading…</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main id="app"></main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/common.js"></script>
<script>
boot('home', data => {
  const hero = data.hero || [];
  const cats = data.categories || [];
  const feat = (data.products || []).filter(p => p.featured);
  const count = id => (data.products || []).filter(p => p.category === id).length;
  document.getElementById('app').innerHTML = `
  <section class="hero" id="hero">
    ${hero.map((s, i) => `<div class="slide ${i === 0 ? 'on' : ''}"><div class="container">
      <div><div class="eyebrow">${esc(s.eyebrow)}</div><h1 class="grad-text" style="-webkit-text-fill-color:transparent">${esc(s.title)}</h1>
      <p class="sub">${esc(s.subtitle)}</p>
      <a class="btn" href="${esc(s.ctaLink || 'products.html')}">${esc(s.ctaText || 'Explore')}</a></div>
      <div class="hero-art">${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.title)}">` : artSvg(['motherboards', 'graphics', 'monitors', 'memory'][i % 4], i)}</div>
    </div></div>`).join('')}
    <div class="dots">${hero.map((_, i) => `<button class="${i === 0 ? 'on' : ''}" aria-label="slide ${i + 1}"></button>`).join('')}</div>
  </section>

  <section class="block"><div class="container">
    <div class="sec-head"><h2>Shop by Category</h2></div>
    <div class="cat-grid">${cats.map(c => `<a class="cat" href="products.html?cat=${esc(c.id)}"><h3>${esc(c.name)}</h3><span>${count(c.id)} product${count(c.id) === 1 ? '' : 's'}</span></a>`).join('')}</div>
  </div></section>

  <section class="block" style="padding-top:0"><div class="container">
    <div class="sec-head"><h2>Featured Products</h2><a href="products.html">View all →</a></div>
    <div class="grid">${feat.map(cardHtml).join('') || '<div class="empty">No featured products yet.</div>'}</div>
  </div></section>

  <section class="block" style="padding-top:0"><div class="container">
    <div class="sec-head"><h2>Why ${esc(data.brand.name)}</h2></div>
    <div class="highlights">${(data.highlights || []).map((h, i) => `<div class="hl"><div class="n grad-text">0${i + 1}</div><h3>${esc(h.title)}</h3><p>${esc(h.text)}</p></div>`).join('')}</div>
  </div></section>`;

  const slides = [...document.querySelectorAll('.slide')];
  const dots = [...document.querySelectorAll('.dots button')];
  let cur = 0, timer;
  const go = n => { cur = (n + slides.length) % slides.length; slides.forEach((s, i) => s.classList.toggle('on', i === cur)); dots.forEach((d, i) => d.classList.toggle('on', i === cur)); };
  dots.forEach((d, i) => d.onclick = () => { go(i); restart(); });
  const restart = () => { clearInterval(timer); if (slides.length > 1) timer = setInterval(() => go(cur + 1), 6500); };
  restart();
});
</script>
</body>
</html>
