<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{display:block}
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#060607;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side .logo{font-size:1.5rem;margin-bottom:18px}
.side button.tab{background:none;border:0;color:#cfcfd6;text-align:left;padding:11px 14px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:1.02rem;cursor:pointer;border-left:3px solid transparent}
.side button.tab:hover{background:var(--surface)}
.side button.tab.on{color:var(--primary);background:var(--surface);border-left-color:var(--primary)}
.side .grow{flex:1}
.panel{padding:30px 36px 80px;max-width:1100px}
.panel h1{font-size:2.2rem;margin-bottom:6px}
.panel .hint{color:var(--muted);margin-bottom:24px}
.box{background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:18px}
.box h3{font-size:1.15rem;color:var(--primary);margin-bottom:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f>label{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:10px 12px;font-size:.95rem;outline:0;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary)}
.f input[type=color]{padding:2px;height:42px;cursor:pointer}
.f textarea{min-height:80px;resize:vertical}
.f.chk{flex-direction:row;align-items:center;gap:8px}
.f.chk label{margin:0;color:var(--text);text-transform:none;letter-spacing:0;font-size:.95rem}
.f.chk input{width:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{color:var(--muted);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.tbl .tn{width:70px;height:52px;background:var(--surface2);display:flex;align-items:center;justify-content:center;padding:4px}
.tbl .tn img,.tbl .tn svg{max-width:100%;max-height:100%;object-fit:contain}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.imgfield{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start}
.imgfield .pv{height:96px;background:var(--surface2);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.imgfield .pv img{max-width:100%;max-height:100%;object-fit:contain}
.imgfield .pv span{color:var(--muted);font-size:.75rem;text-align:center;padding:6px}
.rep{border:1px solid var(--line);padding:14px;margin-bottom:12px;background:#101013}
.rep-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}
.kv input{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:9px 10px;outline:0}
.toast{position:fixed;right:20px;bottom:20px;background:var(--grad);color:#000;padding:10px 18px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--primary) 20%,transparent),transparent 60%)}
.login .box{width:min(400px,92%);padding:34px}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}
.ok{color:#3ddc84}.bad{color:#ff5a5a}
@media(max-width:850px){.adm{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.panel{padding:20px}.imgfield{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast">Saved</div>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
